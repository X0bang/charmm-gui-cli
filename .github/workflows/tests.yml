name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[chem]'
      - name: English regression tests
        env:
          CHARMM_GUI_CLI_LANG: en
        run: python -m unittest discover -s tests -q
      - name: Chinese regression tests
        env:
          CHARMM_GUI_CLI_LANG: zh
        run: python -m unittest discover -s tests -q
      - name: Verify release packaging
        run: python scripts/build_release.py --out release-assets
