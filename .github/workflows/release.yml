name: Publish release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify packages and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          source="charmm-gui-cli-${version}.tar.gz"
          wheel="charmm_gui_cli-${version}-py3-none-any.whl"
          python -c 'import sys; from scripts.build_release import metadata; sys.exit(metadata(__import__("pathlib").Path("."))["version"] != sys.argv[1])' "$version"
          python scripts/build_release.py --out release-assets
          cd release-assets
          sha256sum --ignore-missing --check SHA256SUMS
          # Keep a failed or incomplete upload private; never publish an empty release.
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json; then
            if [[ "$(python -c 'import json; print(json.load(open("release-state.json"))["isDraft"])')" != "True" ]]; then
              # Published releases are immutable here: verify, never overwrite.
              mkdir published-assets
              gh release download "$GITHUB_REF_NAME" --dir published-assets \
                --pattern "$source" --pattern "$wheel" --pattern SHA256SUMS
              (cd published-assets && sha256sum --ignore-missing --check SHA256SUMS)
              test -s "published-assets/$source"
              test -s "published-assets/$wheel"
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "charmm-gui-cli ${version}" --notes-file ../CHANGELOG.md
          fi
          # A retry can repair an incomplete private draft without creating it again.
          gh release upload "$GITHUB_REF_NAME" "$source" "$wheel" SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
